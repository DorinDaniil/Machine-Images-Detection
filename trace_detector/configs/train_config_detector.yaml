seed: 0

model:
  backbone: facebook/dinov3-vitb16-pretrain-lvd1689m   # gated: accept the license on HF and run `hf auth login`
  # backbone: facebook/dinov2-with-registers-base      # open fallback (Apache-2.0), patch 14
  train_last_blocks: 0        # 0 = backbone fully frozen; 2-4 unfreezes the last blocks
  head_dim: 256
  topk_ratio: 0.05            # image score = mean of the top 5 % patch logits

data:
  pairs_csv: data/aligned/aligned_pairs.csv   # from data_tools/prepare_aligned_negatives.py
  val_manifest: null          # optional manifest with split=val (real + fakes with masks)
  data_root: data
  crop_size: 512              # native-resolution crops, no resizing
  p_real: 0.3                 # sample mix: untouched real / fully re-decoded / local paste
  p_full: 0.3
  p_local: 0.4
  alpha_range: [0.3, 1.0]     # mixing ratio = soft target
  area_range: [0.05, 0.6]     # fraction of the image covered by a local paste
  degrade:
    jpeg_p: 0.7
    jpeg_quality: [40, 95]
    resize_p: 0.5
    resize_range: [0.5, 1.0]
    blur_p: 0.2
    blur_sigma: [0.3, 1.5]
    launder_p: 0.3            # down-scale + JPEG + up-scale + JPEG, like a social network
  num_workers: 8

loss:
  patch: 1.0
  image: 1.0
  dice: 0.5

training:
  epochs: 10
  batch_size: 16
  lr: 3.0e-4
  weight_decay: 0.05
  warmup_steps: 500
  amp: true
  device: cuda
  log_every: 50
  checkpoint_dir: checkpoints/trace_dinov3_b16
  log_dir: logs/trace_dinov3_b16
