<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 630" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#111">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#111"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1f6fb2"/></marker>
  </defs>
  <rect width="1280" height="630" fill="#fff"/>

  <!-- (a) inference -->
  <text x="30" y="34" font-size="18" font-weight="bold">(a) Inference: one pass of the trunk, one small expert per generator family</text>
  <g stroke="#111" stroke-width="1.5" fill="none">
    <rect x="30" y="128" width="96" height="96" fill="#ececec"/>
    <rect x="166" y="131" width="232" height="90" rx="4"/>
    <rect x="438" y="141" width="112" height="70" rx="4"/>
    <rect x="1118" y="96" width="142" height="160" rx="4"/>
    <path d="M126 176 H164" marker-end="url(#a)"/>
    <path d="M398 176 H436" marker-end="url(#a)"/>
    <path d="M1080 176 H1116" marker-end="url(#a)"/>
  </g>
  <g stroke="#1f6fb2" stroke-width="1.5" fill="none">
    <rect x="610" y="62" width="330" height="44" rx="4"/>
    <rect x="610" y="116" width="330" height="44" rx="4"/>
    <rect x="610" y="170" width="330" height="44" rx="4"/>
    <rect x="610" y="262" width="330" height="44" rx="4"/>
    <rect x="980" y="62" width="100" height="244" rx="4"/>
    <path d="M550 176 H578 V84 H608" marker-end="url(#b)"/>
    <path d="M578 138 H608" marker-end="url(#b)"/>
    <path d="M578 176 V192 H608" marker-end="url(#b)"/>
    <path d="M578 192 V284 H608" marker-end="url(#b)"/>
    <path d="M940 84 H978" marker-end="url(#b)"/>
    <path d="M940 138 H978" marker-end="url(#b)"/>
    <path d="M940 192 H978" marker-end="url(#b)"/>
    <path d="M940 284 H978" marker-end="url(#b)"/>
  </g>
  <text x="78" y="182" text-anchor="middle" font-style="italic" font-size="16">x</text>
  <text x="78" y="246" text-anchor="middle">3 × 512 × 512</text>
  <text x="282" y="160" text-anchor="middle" font-weight="bold" font-size="15">Trunk</text>
  <text x="282" y="181" text-anchor="middle">DINOv3 ConvNeXt-Tiny</text>
  <text x="282" y="201" text-anchor="middle">stem + stages 1–3, 12M</text>
  <text x="282" y="246" text-anchor="middle" fill="#555">computed once per image</text>
  <text x="494" y="172" text-anchor="middle" font-style="italic" font-size="16">f</text>
  <text x="494" y="194" text-anchor="middle">384 × 32 × 32</text>
  <g fill="#1f6fb2">
    <text x="624" y="89" font-weight="bold">all</text>
    <text x="926" y="89" text-anchor="end">softmax [ real, 36 models ]</text>
    <text x="624" y="143" font-weight="bold">openai</text>
    <text x="926" y="143" text-anchor="end">softmax [ real, gpt-image-1, dalle-3 ]</text>
    <text x="624" y="197" font-weight="bold">google</text>
    <text x="926" y="197" text-anchor="end">softmax [ real, imagen-3, imagen-4, … ]</text>
    <text x="775" y="246" text-anchor="middle" font-size="18">⋮</text>
    <text x="624" y="289" font-weight="bold">video_cn</text>
    <text x="926" y="289" text-anchor="end">softmax [ real, wan-2.1, wan-2.2, … ]</text>
    <text x="1030" y="176" text-anchor="middle" font-weight="bold" font-size="15">p &gt; τ ?</text>
    <text x="1030" y="206" text-anchor="middle" font-size="12">own threshold</text>
    <text x="1030" y="222" text-anchor="middle" font-size="12">per expert</text>
  </g>
  <text x="1189" y="122" text-anchor="middle" font-weight="bold" font-size="15">Verdict</text>
  <text x="1189" y="148" text-anchor="middle" font-size="13">generated if any</text>
  <text x="1189" y="165" text-anchor="middle" font-size="13">expert is above</text>
  <text x="1189" y="182" text-anchor="middle" font-size="13">its threshold</text>
  <text x="1189" y="210" text-anchor="middle" font-size="13">family: that expert</text>
  <text x="1189" y="227" text-anchor="middle" font-size="13">model: its top class</text>
  <text x="610" y="330" fill="#555">Expert: own copy of stage 4 → mean → norm → linear. 15M parameters, 25 ms on a CPU.</text>
  <text x="30" y="330" fill="#555">p = 1 − P(real): the probability that the family made the image.</text>
  <path d="M30 356 H1250" stroke="#ccc"/>

  <!-- (b) training -->
  <text x="30" y="392" font-size="18" font-weight="bold">(b) Training: every expert on its own data</text>
  <g stroke-width="1.5" fill="none">
    <rect x="30" y="414" width="372" height="124" rx="4" stroke="#111"/>
    <rect x="454" y="414" width="372" height="124" rx="4" stroke="#1f6fb2"/>
    <rect x="878" y="414" width="372" height="124" rx="4" stroke="#1f6fb2"/>
    <path d="M402 476 H452" stroke="#111" marker-end="url(#a)"/>
    <path d="M826 476 H876" stroke="#111" marker-end="url(#a)"/>
  </g>
  <text x="46" y="440" font-weight="bold" font-size="15">1. General expert “all”</text>
  <text x="46" y="466">every generator against the reals</text>
  <text x="46" y="488">trunk and expert trained together</text>
  <text x="46" y="520" fill="#555">→ trunk.pt, experts/all.pt</text>
  <text x="470" y="440" font-weight="bold" font-size="15" fill="#1f6fb2">2. Family experts, one at a time</text>
  <text x="470" y="466">trunk frozen; expert starts as a copy of “all”</text>
  <text x="470" y="488">its generators against the reals, nothing else</text>
  <text x="470" y="520" fill="#555">→ experts/&lt;family&gt;.pt</text>
  <text x="894" y="440" font-weight="bold" font-size="15" fill="#1f6fb2">3. Thresholds</text>
  <text x="894" y="466">from held-out real images only</text>
  <text x="894" y="488">the same share of false alarms for every expert,</text>
  <text x="894" y="510">together at most 1 % of the reals</text>
  <text x="30" y="574" fill="#555">Class 0 of every softmax is “real”, the other classes are the generators of the family: the expert that fires also names the exact model.</text>
  <text x="30" y="596" fill="#555">A new family: add it to the config and train one more expert, the others stay as they are.</text>
  <g font-size="13">
    <path d="M1000 26 H1040" stroke="#111" stroke-width="1.5"/><text x="1048" y="30">shared, computed once</text>
    <path d="M1000 46 H1040" stroke="#1f6fb2" stroke-width="1.5"/><text x="1048" y="50" fill="#1f6fb2">per family</text>
  </g>
</svg>
