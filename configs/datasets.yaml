# Dataset registry. Add a Hugging Face dataset with a few lines (kind hf_parquet / hf_files, see
# src/data/sources/generic.py); special layouts use kind: custom with an adapter in src/data/sources.
# role: train_real | calib_real | test.   The full registry with ~75 sources lives in branch data-registry.

raw_root: data/raw

datasets:
  coco_real:
    kind: hf_parquet
    role: train_real
    repo: detection-datasets/coco
    split: val
    image_column: image
    label: 0
    content_type: photo
    manifest_split: train
    min_side: 0
    max_items: 2000
    notes: "COCO val2017 photos, <= 640 px, Flickr CC images; the only real source of the pilot"

  dailybench:
    kind: custom
    role: test
    max_items: 2000
    notes: "Apache-2.0. Reals + fakes by SD3.5, FLUX.1, FLUX.2, Qwen-Image, Z-Image, Nano Banana 2, GPT-Image 2, and edits by FLUX-Fill, Qwen-Image-Edit, Nano Banana 2, GPT-Image 2"
