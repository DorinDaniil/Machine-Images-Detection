# Real images against images of many open and API generators (OpenFake). One plain classifier on a small backbone
# (DINOv3 ConvNeXt-Tiny): softmax over [real, family 1, ..., family m]. An image is called generated when
# p(generated) = 1 - p(real) is above 0.5; the family of the generator is the largest of the other classes.
# Whole images resized to 512 x 512.
# Data: one pool of folders, data/real/<source>/ and data/fake/<generator>/, plus your own folders with reals.
# 85 % of every folder is for training, 5 % for validation and the calibration, 10 % for the test.

data:
  dir: data
  workers: 4                # OpenFake files downloaded at once, ~5.4 GB of temporary disk each
  train:                    # OpenFake core/train: 608 files of ~3800 rows; images kept as original bytes
    n_real: 300000          # LAION and Pexels photos. null: all (~590k usable)
    n_per_model: 10000      # cap per generator; smaller generators give all they have. null: no cap
    generators:             # null: all 72. 36 listed: API models, open flagships, the most used community
      # API
      - gpt-image-1         #   fine-tunes, frames of video models. Left out: duplicates of the same model under
      - dalle-3             #   other names, anime / illustration models (no real drawings to match them)
      - imagen-3.0-002
      - imagen-4.0
      - midjourney-6
      - ideogram-3.0
      - flux-1.1-pro
      - grok-2-image-1212
      - grok-imagine
      - seedream-v4.0
      - seedream-v4.5
      - nano-banana-2
      - mystic
      # open flagships
      - sd-1.5
      - sd-2.1
      - sdxl
      - sd-3.5
      - flux.1-dev
      - flux.1-schnell
      - flux.2-dev
      - flux.2-klein-4b
      - hidream-i1-full
      - qwen-image
      - chroma
      - playground-v2.5-1024px-aesthetic
      # community fine-tunes (Civitai): photorealism, amateur-photo look
      - sdxl-juggernaut
      - sdxl-realvis-v5
      - sdxl-epic-realism
      - sd-1.5-dreamshaper
      - realistic_vision_v5.1_novae
      - flux-amateursnapshotphotos
      - amateur-photography-v6
      # frames of video models
      - wan-video-2.2
      - wan-video-2.1
      - hunyuan-video
      - ltxv-2.3
    max_files: null         # null: all 608 files (3.3 TB); 200 files (1.1 TB) still fill 5000 for the frequent
                            #   generators but give only a third of the rare ones (nano-banana-2, seedream, video)
  test:                     # OpenFake core/test, 13 files, 68 GB: newer generators (GPT Image 1.5 and 2, Nano Banana
    n_real: 5000            #   Pro, Midjourney 7, ...) and DOCCI reals. They join the same pool as core/train.
    real_sources: [docci]   #   To take more of them: raise the quotas, delete data/openfake_test and
    n_per_model: 1000       #   data/openfake_test.csv, run download_data.py again
  real_dirs: []             # more folders with real images, e.g. [/data/logos, /data/scans]: every image under them,
                            #   through all subfolders, joins the reals. The report has a line per <folder>/<subfolder>.
                            #   A folder put into data/real/ is picked up the same way
  val_share: 0.05           # of every folder, by the hash of "<folder>/<file>": the best epoch and the calibration
  test_share: 0.10          # of every folder, never trained on: report.md. The split is the same on every run,
                            #   an image keeps its part when images are added
  sid:                      # SID_Set validation, another dataset: the test of local edits
    n_per_class: 1000
  n_render: 1000            # rendered text / UI / charts / logos in fonts not used in training: half joins the
                            #   validation reals, half the test reals
  render_train: 0.05        # more of them (other fonts) as training reals: this share of the training reals (~13k,
                            #   ~10 min to draw once, ~1.2 GB): fewer false positives on screenshots, documents, logos

model:
  backbone: convnext_tiny.dinov3_lvd1689m   # timm, no access request; 28M parameters. Larger: convnext_small.dinov3_lvd1689m
  families:                 # the classes of the model next to "real": the generators of one maker or one
                            #   architecture. A new version of a known family falls into its class. Regroup freely;
                            #   a generator is the name of a folder in data/fake
    openai: [gpt-image-1, gpt-image-1.5, gpt-image-2, dalle-3]
    google: [imagen-3.0-002, imagen-4.0, nano-banana-2, nano-banana-pro]
    midjourney: [midjourney-6, midjourney-7]
    ideogram: [ideogram-2.0, ideogram-3.0]
    xai: [grok-2-image-1212, grok-imagine, aurora-20-1-25]
    seedream: [seedream-v4.0, seedream-v4.5, seedream-v5.0]             # ByteDance
    qwen: [qwen-image, z-image-turbo]                                   # Alibaba
    flux: [flux-1.1-pro, flux.1-dev, flux.1-schnell, flux.2-dev, flux.2-klein-4b, flux.2-klein-9b, chroma, mystic,
           flux-amateursnapshotphotos, amateur-photography-v6]
    sd: [sd-1.5, sd-2.1, sd-1.5-dreamshaper, realistic_vision_v5.1_novae]
    sdxl: [sdxl, sdxl-juggernaut, sdxl-realvis-v5, sdxl-epic-realism, playground-v2.5-1024px-aesthetic]
    dit: [sd-3.5, hidream-i1-full, lumina-17-2-25]                      # other open diffusion transformers
    video_cn: [wan-video-2.1, wan-video-2.2, wan-video-2.5, hunyuan-video]   # frames of the Chinese video models
    video: [veo-3, sora-2, ltxv-2.3]                                    # frames of the other video models
    recraft: [recraft-v2, recraft-v3]
    ernie: [ernie-image, ernie-image-turbo]                             # Baidu
    # A generator of data/fake that is in no family is a class of its own. Now these are frames-23-1-25 (Runway)
    # and halfmoon-4-4-25 (Reve)

train:
  size: 512                 # every image, whole, resized to 512 x 512 (aspect not kept), in training and testing;
                            #   ImageNet mean / std are applied inside the model. Training views (src/data/dataset.py):
                            #   one JPEG pass first if the file is not a JPEG; a random part of 50-100 % of the image,
                            #   aspect 1:2-2:1; colour 25 %, grey 3 %, sharpening 10 %, a censored region 10 %
                            #   (blur, big pixels, a box or a bar over 1-20 % of the image),
                            #   resampling 25 %, blur 15 %, noise 20 %; JPEG q50-95 or WebP (20 %), a second JPEG 25 %;
                            #   the resize; flip, a turn by 90 degrees 5 %. A third of the views get only the
                            #   crop and the compression
  epochs: 3                 # An epoch: as many generated images as the training part has and as many reals, drawn
                            #   anew every epoch; then validation, a row in metrics.csv and state.pt
  batch_size: 32            # ~10 GB of GPU memory
  val_size: 5000            # up to this many held-out images, half of them real; the model is saved at the epoch
                            #   with the lowest validation loss
  balance: 0.0              # how the generated images of an epoch are drawn. 0: every one once. Above 0: an image
                            #   of a generator with n images comes n ** -balance times as often, so small generators
                            #   are seen more. 0.5: a generator with 1000 images gets a third of the views of one
                            #   with 10000, not a tenth; 1: every generator is seen equally often
  contrast: 0.0             # weight of the supervised InfoNCE of the image vectors, added to the cross-entropy:
                            #   images of one class (real, or one family) are pulled together, images of different
                            #   classes pushed apart. Every batch is compared with the vectors of the last steps
                            #   (4096 of them), so a small batch is enough. 0: off; to try: 0.5
  lr: 5.0e-5                # the backbone
  head_lr: 1.0e-3           # the linear layer
  weight_decay: 0.05
  save_every: 500           # steps between the saves of state.pt inside an epoch: after a stop --resume goes on from the last one
  num_workers: 8
  device: cuda
  alpha: 0.01               # after training the bias of the class "real" is set so that this share of the
  max_calib: 10000          #   validation reals (up to max_calib of them) has p(generated) > 0.5
  out: runs/base            # model.pt, metrics.csv, state.pt, config.yaml, report.md, report.json.
                            #   Another variant next to it: --set train.out=runs/<name> train.contrast=0.5
