# Real images vs images of many open and API generators (OpenFake), frozen DINOv3 + patch head.
# Test on newer generators, other real sources, local edits and non-photo reals.

data:
  dir: data
  train:                    # OpenFake core/train, streamed; ~4000 rows per 5 GB shard
    max_rows: 16000
    n_real: 5000            # LAION and Pexels photos; 15 % of them are kept apart for calibration
    n_per_model: 150        # cap per generator, so frequent models do not dominate
  test:                     # OpenFake core/test: newer generators, DOCCI reals
    max_rows: 30000
    n_real: 1000
    real_sources: [docci]
    n_per_model: 200
  sid:                      # SID_Set validation: local edits with masks (not used for training)
    max_rows: 6000
    n_per_class: 500
  n_render: 600             # rendered text / UI / charts / logos: half for calibration, half for FPR test

model:
  backbone: vit_large_patch16_dinov3.lvd1689m   # timm, no access request; faster: vit_base_patch16_dinov3.lvd1689m
  layers: [11, 17, 23]      # patch features of three blocks of ViT-L (24 blocks)
  head_dim: 256
  topk: 0.05                # image score = mean of the top 5 % patch logits

train:
  crop: 448
  epochs: 8
  batch_size: 32
  lr: 3.0e-4
  weight_decay: 0.05
  num_workers: 8
  device: cuda
  out: runs/pilot

test:
  alpha: 0.01               # target false-positive rate; threshold from calibration reals only
  protocols: [equalized, native]
