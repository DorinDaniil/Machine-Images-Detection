# Pilot: train on COCO photos re-decoded by one VAE,
# test on VAEs never seen in training and on images of real generators.

data:
  dir: data
  n_real: 2000              # COCO val2017 photos: 80 % train, 20 % test
  max_side: 1024
  train_vae: [sd15]         # Stable Diffusion 1.x VAE makes the training fakes
  test_vae: [sdxl, flux]    # unseen VAEs for the test
  generators: [gpt-image-2, nano-banana-pro, nano-banana-2.0, FLUX.2-pro, Seedream-4.5,
               Imagen-4.0, Qwen-Image, HunyuanImage-3.0, kling_v2_1]
  n_per_generator: 200      # images per model from Qwen/Qwen-Image-Bench

model:
  backbone: facebook/dinov3-vitb16-pretrain-lvd1689m   # gated; open: facebook/dinov2-with-registers-base
  head_dim: 256
  topk: 0.05                # image score = mean of the top 5 % patch logits

train:
  crop: 384
  p_real: 0.3
  p_full: 0.3
  p_local: 0.4
  epochs: 10
  batch_size: 32
  lr: 3.0e-4
  weight_decay: 0.05
  num_workers: 8
  device: cuda
  out: runs/pilot
