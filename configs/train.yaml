# Real images vs images of many open and API generators (OpenFake), frozen DINOv3 + patch head, trained on
# 512 x 512 views at the images' own resolution; locally edited images with masks (SID_Set train) can be added.
# Test on newer generators, other real sources, local edits and non-photo reals: whole images in 512 tiles.
# Data: 300k reals, up to 10k images of each of 36 generators; 3.3 TB downloaded, ~0.6 TB kept.

data:
  dir: data
  workers: 4                # OpenFake files downloaded at once, ~5.4 GB of temporary disk each
  train:                    # OpenFake core/train: 608 files of ~3800 rows; images kept as original bytes
    n_real: 300000          # LAION and Pexels photos; 15 % are kept apart for calibration. null: all (~590k usable)
    n_per_model: 10000      # cap per generator; smaller generators give all they have. null: no cap
    generators:             # null: all 72. 36 listed: API models, open flagships, the most used community
      # API
      - gpt-image-1         #   fine-tunes, frames of video models. Left out: duplicates of the same model under
      - dalle-3             #   other names, anime / illustration models (no real drawings to match them)
      - imagen-3.0-002
      - imagen-4.0
      - midjourney-6
      - ideogram-3.0
      - flux-1.1-pro
      - grok-2-image-1212
      - grok-imagine
      - seedream-v4.0
      - seedream-v4.5
      - nano-banana-2
      - mystic
      # open flagships
      - sd-1.5
      - sd-2.1
      - sdxl
      - sd-3.5
      - flux.1-dev
      - flux.1-schnell
      - flux.2-dev
      - flux.2-klein-4b
      - hidream-i1-full
      - qwen-image
      - chroma
      - playground-v2.5-1024px-aesthetic
      # community fine-tunes (Civitai): photorealism, amateur-photo look
      - sdxl-juggernaut
      - sdxl-realvis-v5
      - sdxl-epic-realism
      - sd-1.5-dreamshaper
      - realistic_vision_v5.1_novae
      - flux-amateursnapshotphotos
      - amateur-photography-v6
      # frames of video models
      - wan-video-2.2
      - wan-video-2.1
      - hunyuan-video
      - ltxv-2.3
    max_files: null         # null: all 608 files (3.3 TB); 200 files (1.1 TB) still fill 5000 for the frequent
                            #   generators but give only a third of the rare ones (nano-banana-2, seedream, video)
  test:                     # OpenFake core/test: 13 files, 68 GB; newer generators, DOCCI reals
    n_real: 5000
    real_sources: [docci]
    n_per_model: 1000
  sid_train:                # SID_Set train: reals, fully synthetic and locally edited images with masks: the edits
    n_per_class: 0          #   teach the patch map where a region was generated. 0: off. 20000: ~70 of 249 files, ~36 GB
  sid:                      # SID_Set validation: the test of local edits
    n_per_class: 1000
  n_render: 1000            # rendered text / UI / charts / logos: half for calibration, half for FPR test

model:
  backbone: vit_large_patch16_dinov3.lvd1689m   # timm, no access request; faster: vit_base_patch16_dinov3.lvd1689m
  layers: [11, 17, 23]      # patch features of three blocks of ViT-L (24 blocks)
  head_dim: 256
  topk: 0.05                # image score = mean of the top 5 % patch logits

train:
  size: 512                 # training views: a random 512 x 512 crop at the image's own resolution, never resized
                            #   (DINOv3 adapted to high resolution on 512-768 crops); the test scores whole images
                            #   in tiles of this size
  down_p: 0.3               # augmentation before the crop: downscaled by 0.5-1 (short side stays >= size), as images
                            #   shared online. Further (src/data/dataset.py): one JPEG pass first if the file is not a
                            #   JPEG; after the crop: flip; resampling 20 %, blur 10 %, noise 20 %; JPEG q60-95 or
                            #   WebP (20 %), a second JPEG 25 %
  samples_per_epoch: null   # balanced draws per epoch, then validation and a checkpoint; null: the size of the
                            #   train set (~585k images)
  epochs: 5
  balance_floor: 5000       # a generator with fewer images weighs in proportion to its size, the rest equally
  batch_size: 32            # images per batch and optimizer step
  val_size: 5000            # images held out for validation; best.pt = epoch with the lowest validation loss
  save_every: 1000          # optimizer steps (32k images) between saves of the training state; --resume goes on from it
  lr: 3.0e-4
  weight_decay: 0.05
  num_workers: 8
  device: cuda
  out: runs/pilot

test:
  alpha: 0.01               # target false-positive rate; threshold from calibration reals only
  max_calib: 10000          # calibration reals used (of the 15 % held out): enough for a 1 % threshold
