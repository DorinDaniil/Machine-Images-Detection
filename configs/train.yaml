# Real images vs images of many open and API generators (OpenFake), frozen DINOv3 + patch head.
# Test on newer generators, other real sources, local edits and non-photo reals.
# Pilot: 300k reals and up to 10k images of each of 36 generators from the whole of OpenFake train:
# 3.3 TB downloaded, ~0.6 TB kept on disk.

data:
  dir: data
  workers: 4                # OpenFake files downloaded at once, ~5.4 GB of temporary disk each
  train:                    # OpenFake core/train: 608 files of ~3800 rows; images kept as original bytes
    n_real: 300000          # LAION and Pexels photos; 15 % are kept apart for calibration. null: all (~590k usable)
    n_per_model: 10000      # cap per generator; smaller generators give all they have. null: no cap
    generators:             # null: all 72. 36 listed: API models, open flagships, the most used community
      # API
      - gpt-image-1         #   fine-tunes, frames of video models. Left out: duplicates of the same model under
      - dalle-3             #   other names, anime / illustration models (no real drawings to match them)
      - imagen-3.0-002
      - imagen-4.0
      - midjourney-6
      - ideogram-3.0
      - flux-1.1-pro
      - grok-2-image-1212
      - grok-imagine
      - seedream-v4.0
      - seedream-v4.5
      - nano-banana-2
      - mystic
      # open flagships
      - sd-1.5
      - sd-2.1
      - sdxl
      - sd-3.5
      - flux.1-dev
      - flux.1-schnell
      - flux.2-dev
      - flux.2-klein-4b
      - hidream-i1-full
      - qwen-image
      - chroma
      - playground-v2.5-1024px-aesthetic
      # community fine-tunes (Civitai): photorealism, amateur-photo look
      - sdxl-juggernaut
      - sdxl-realvis-v5
      - sdxl-epic-realism
      - sd-1.5-dreamshaper
      - realistic_vision_v5.1_novae
      - flux-amateursnapshotphotos
      - amateur-photography-v6
      # frames of video models
      - wan-video-2.2
      - wan-video-2.1
      - hunyuan-video
      - ltxv-2.3
    max_files: null         # null: all 608 files (3.3 TB); 200 files (1.1 TB) still fill 5000 for the frequent
                            #   generators but give only a third of the rare ones (nano-banana-2, seedream, video)
  test:                     # OpenFake core/test: 13 files, 68 GB; newer generators, DOCCI reals
    n_real: 5000
    real_sources: [docci]
    n_per_model: 1000
  sid:                      # SID_Set validation: local edits with masks (not used for training)
    n_per_class: 1000
  n_render: 1000            # rendered text / UI / charts / logos: half for calibration, half for FPR test

model:
  backbone: vit_large_patch16_dinov3.lvd1689m   # timm, no access request; faster: vit_base_patch16_dinov3.lvd1689m
  layers: [11, 17, 23]      # patch features of three blocks of ViT-L (24 blocks)
  head_dim: 256
  topk: 0.05                # image score = mean of the top 5 % patch logits

train:
  max_side: 1536            # whole images at their own resolution, never resized; this is a memory limit only:
                            #   a longer side (large photos) is cut by a random crop. Test uses it too
  crop_p: 0.5               # augmentation: a random part of the image (each side 40-100 %, at least 256 px)
  samples_per_epoch: 100000 # balanced draws per epoch, then validation and a checkpoint (~1 h on one GPU)
  epochs: 5
  balance_floor: 5000       # a generator with fewer images weighs in proportion to its size, the rest equally
  batch_size: 32            # images per optimizer step; sizes differ, so they go through the model one by one
  val_size: 5000            # images held out for validation
  lr: 3.0e-4
  weight_decay: 0.05
  num_workers: 8
  device: cuda
  out: runs/pilot

test:
  alpha: 0.01               # target false-positive rate; threshold from calibration reals only
  protocols: [equalized, native]
