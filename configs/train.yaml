# Real images vs images of many open and API generators (OpenFake), frozen DINOv3 + patch head.
# Test on newer generators, other real sources, local edits and non-photo reals.
# Pilot: ~100k reals and ~100k fakes of 21 popular and recent generators, ~1 TB downloaded, ~0.25 TB on disk.

data:
  dir: data
  workers: 8                # OpenFake files downloaded at once, ~5.4 GB of temporary disk each
  train:                    # OpenFake core/train: 608 files of ~3800 rows; images kept as original bytes
    n_real: 100000          # LAION and Pexels photos; 15 % are kept apart for calibration. null: all (~590k usable)
    n_per_model: 5000       # cap per generator; smaller generators give all they have. null: no cap
    generators:             # null: all 72. Listed: API models and open flagships; the rest (community
      - gpt-image-1         #   fine-tunes, anime, video frames) stays out of this pilot
      - dalle-3
      - imagen-3.0-002
      - imagen-4.0
      - midjourney-6
      - ideogram-3.0
      - flux-1.1-pro
      - grok-2-image-1212
      - seedream-v4.0
      - nano-banana-2
      - sd-1.5
      - sd-2.1
      - sdxl
      - sd-3.5
      - flux.1-dev
      - flux.1-schnell
      - flux.2-dev
      - flux.2-klein-4b
      - hidream-i1-full
      - qwen-image
      - chroma
    max_files: 200          # ~1.1 TB downloaded; enough for 5000 of every generator above with >15k images.
                            #   Rare ones (nano-banana-2, seedream, grok) give what these files hold. null: all 608
  test:                     # OpenFake core/test: 13 files, 68 GB; newer generators, DOCCI reals
    n_real: 5000
    real_sources: [docci]
    n_per_model: 1000
  sid:                      # SID_Set validation: local edits with masks (not used for training)
    n_per_class: 1000
  n_render: 1000            # rendered text / UI / charts / logos: half for calibration, half for FPR test

model:
  backbone: vit_large_patch16_dinov3.lvd1689m   # timm, no access request; faster: vit_base_patch16_dinov3.lvd1689m
  layers: [11, 17, 23]      # patch features of three blocks of ViT-L (24 blocks)
  head_dim: 256
  topk: 0.05                # image score = mean of the top 5 % patch logits

train:
  crop: 448
  epochs: 5
  batch_size: 32
  lr: 3.0e-4
  weight_decay: 0.05
  num_workers: 8
  device: cuda
  out: runs/pilot

test:
  alpha: 0.01               # target false-positive rate; threshold from calibration reals only
  protocols: [equalized, native]
