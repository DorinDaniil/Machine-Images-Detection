# Real images against images of many open and API generators (OpenFake). An ensemble on one small backbone:
# a shared trunk (DINOv3 ConvNeXt-Tiny), a general expert over every generator and one expert per generator
# family. Every expert is trained on its own, "its generators against the reals", and also names the exact model.
# An image is called generated when any expert is above its own threshold. Whole images resized to 512 x 512.
# Test on newer generators, other real sources, local edits and non-photo reals.
# Data: 300k reals, up to 10k images of each of 36 generators; 3.3 TB downloaded, ~0.6 TB kept.

data:
  dir: data
  workers: 4                # OpenFake files downloaded at once, ~5.4 GB of temporary disk each
  train:                    # OpenFake core/train: 608 files of ~3800 rows; images kept as original bytes
    n_real: 300000          # LAION and Pexels photos; 15 % are kept apart for calibration. null: all (~590k usable)
    n_per_model: 10000      # cap per generator; smaller generators give all they have. null: no cap
    generators:             # null: all 72. 36 listed: API models, open flagships, the most used community
      # API
      - gpt-image-1         #   fine-tunes, frames of video models. Left out: duplicates of the same model under
      - dalle-3             #   other names, anime / illustration models (no real drawings to match them)
      - imagen-3.0-002
      - imagen-4.0
      - midjourney-6
      - ideogram-3.0
      - flux-1.1-pro
      - grok-2-image-1212
      - grok-imagine
      - seedream-v4.0
      - seedream-v4.5
      - nano-banana-2
      - mystic
      # open flagships
      - sd-1.5
      - sd-2.1
      - sdxl
      - sd-3.5
      - flux.1-dev
      - flux.1-schnell
      - flux.2-dev
      - flux.2-klein-4b
      - hidream-i1-full
      - qwen-image
      - chroma
      - playground-v2.5-1024px-aesthetic
      # community fine-tunes (Civitai): photorealism, amateur-photo look
      - sdxl-juggernaut
      - sdxl-realvis-v5
      - sdxl-epic-realism
      - sd-1.5-dreamshaper
      - realistic_vision_v5.1_novae
      - flux-amateursnapshotphotos
      - amateur-photography-v6
      # frames of video models
      - wan-video-2.2
      - wan-video-2.1
      - hunyuan-video
      - ltxv-2.3
    max_files: null         # null: all 608 files (3.3 TB); 200 files (1.1 TB) still fill 5000 for the frequent
                            #   generators but give only a third of the rare ones (nano-banana-2, seedream, video)
  test:                     # OpenFake core/test: 13 files, 68 GB; newer generators, DOCCI reals
    n_real: 5000
    real_sources: [docci]
    n_per_model: 1000
  sid:                      # SID_Set validation: the test of local edits
    n_per_class: 1000
  n_render: 1000            # rendered text / UI / charts / logos: half for calibration, half for FPR test
  render_train: 0.05        # more of them (other fonts) as training reals: this share of the training reals (~13k,
                            #   ~10 min to draw once, ~1.2 GB): fewer false positives on screenshots, documents, logos

model:
  backbone: convnext_tiny.dinov3_lvd1689m   # timm, no access request; 28M parameters. Larger: convnext_small.dinov3_lvd1689m
  shared: 4                 # the trunk = the stem and the first 3 of the 4 stages, computed once per image; every
                            #   expert owns a copy of the last stage (15M parameters, ~25 ms on a CPU).
                            #   3: the two last stages per expert; 0: every expert is a whole separate network
  families:                 # one expert per family: the generators of one maker or one architecture against the
                            #   reals. A new version of a known family is caught by its expert. Regroup freely:
                            #   every generator of data.train.generators must be in exactly one family.
                            #   run_train.py adds the general expert "all": every generator, trained first
    openai: [gpt-image-1, dalle-3]
    google: [imagen-3.0-002, imagen-4.0, nano-banana-2]
    midjourney: [midjourney-6]
    ideogram: [ideogram-3.0]
    xai: [grok-2-image-1212, grok-imagine]
    seedream: [seedream-v4.0, seedream-v4.5]                  # ByteDance
    qwen: [qwen-image]                                        # Alibaba
    flux: [flux-1.1-pro, flux.1-dev, flux.1-schnell, flux.2-dev, flux.2-klein-4b, chroma, mystic,
           flux-amateursnapshotphotos, amateur-photography-v6]
    sd: [sd-1.5, sd-2.1, sd-1.5-dreamshaper, realistic_vision_v5.1_novae]
    sdxl: [sdxl, sdxl-juggernaut, sdxl-realvis-v5, sdxl-epic-realism, playground-v2.5-1024px-aesthetic]
    dit: [sd-3.5, hidream-i1-full]                            # other open diffusion transformers
    video_cn: [wan-video-2.2, wan-video-2.1, hunyuan-video]   # frames of the Chinese video models
    ltx: [ltxv-2.3]                                           # frames of LTX Video

train:
  size: 512                 # every image, whole, resized to 512 x 512 (aspect not kept), in training and testing;
                            #   ImageNet mean / std are applied inside the model. Training views (src/data/dataset.py):
                            #   one JPEG pass first if the file is not a JPEG; a random part of 50-100 % of the image,
                            #   aspect 1:2-2:1; resampling 20 %, blur 10 %, noise 20 %; JPEG q60-95 or WebP (20 %),
                            #   a second JPEG 25 %; the resize; flip
  epochs: 3                 # per expert. An epoch: every generated image of the expert once and as many reals,
                            #   drawn anew every epoch; then validation, metrics/<name>.csv and state.pt.
                            #   In all every generated image is seen 6 times: 3 by "all", 3 by its family expert
  batch_size: 32            # ~10 GB of GPU memory for "all" (the trunk is trained), far less for a family expert
  val_size: 5000            # per expert: up to this many held-out images, half of them real; the expert is saved
                            #   at the epoch with the lowest validation loss
  lr: 5.0e-5                # the trunk and the last stage
  head_lr: 1.0e-3           # the linear layer
  weight_decay: 0.05
  num_workers: 8
  device: cuda
  out: runs/experts         # trunk.pt, experts/<name>.pt, metrics/<name>.csv, calibration.json, thresholds.json, report.md

test:
  alpha: 0.01               # target false-positive rate of the whole ensemble; thresholds from calibration reals only
  max_calib: 10000          # calibration reals used (of the 15 % held out): enough for a 1 % threshold
