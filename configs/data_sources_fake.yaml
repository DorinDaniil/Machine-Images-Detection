# Fake / benchmark image sources: real (label 0) and generated or edited (label 1) images.
# One adapter per entry in src/data/sources/<name>.py; shared helpers in _fake_files.py / _fake_hub.py.
# Build a test manifest:
#   python -m src.data.build_manifest --datasets dailybench,so_fake,opensdid --max-items 2000 \
#       --out data/manifests/test_fake.csv
#
# Every row is split=test (held-out benchmarks, never train on them). generator is a short lowercase
# slug; editing models that are also generators get an "-edit" suffix (e.g. gpt-image-2-edit).
# Masks are stored as binary PNG (255 = edited region) next to the image as <stem>.mask.png.
#
# download: auto   = download() fetches by itself (gated repos need approved access + HF token)
#           manual = needs a manual step first (download() prints what to do and the layout)
# size: what the adapter uses, not the whole repo. Caps (--max-items): zip sources read only
#   the chosen members via HTTP range requests; parquet/arrow sources download whole shards one at
#   a time (deleted after export), so the download is rounded up to whole shards.
# HF ids, file lists, zip directories and parquet footers were checked on 2026-10-20 with
# HfApi.dataset_info / list_repo_files and range reads; no images were downloaded.

sources:
  - name: dailybench
    hf_id: WhiteJiangzz/DailyBench      # identical mirror: Misaka426/DailyBench; ModelScope WhiteJiang/DailyBench
    url: https://dailybench.github.io/  # arXiv 2607.24016
    license: Apache-2.0
    size: 14 zips, 20.2 GB; FakeBench ~184.6k images (half real), ManipulationBench ~85.5k images
    generators: [sd3.5-large, flux.1, flux.2, qwen-image-2512, z-image, nano-banana-2, gpt-image-2,
                 flux.1-fill, flux.2-klein-edit, qwen-image-edit-2511, step1x-edit-v1.2, nano-banana-2-edit,
                 gpt-image-2-edit]
    content_types: [photo]
    has_masks: false
    download: auto
    notes: >-
      Each zip pairs fakes with real photos (<subset>/0_real/NNN, <subset>/1_fake/NNN). GPT-Image 2 and
      Nano Banana 2 have only ~250 fakes (FakeBench) / ~400 edits (ManipulationBench); the open models
      12-20k. ManipulationBench = object Remove/Replace edits of real photos, no masks released.
      Reals repeat across subsets under the same names (listed per subset). Qwen-Image_train.zip skipped.

  - name: mllm_bench
    hf_id: zr-zhang/MLLM-Generated-Image-Detection-Dataset
    url: https://github.com/xbrainnet/SAP-DSP   # arXiv 2608.01258
    license: Apache-2.0 on the card + use restriction (AIGC-detection / forensics research only)
    size: 45,103 images, 50.3 GB (mostly PNG)
    generators: [gpt-image-2, nano-banana-2, flux.2, qwen-image-2.1]
    content_types: [photo]
    has_masks: false
    download: auto
    notes: >-
      images/<generator>/<Texture|Structure|Hybrid> Images/; ~3k images per cell, Real has its own
      folders. FLUX.2 and Qwen Image 2.1 folders exist in the repo although the paper title names
      only GPT Image 2 and Nano Banana 2. Cap is exact (per-file download, even share per cell).

  - name: community_forensics
    hf_id: OwensLab/CommunityForensics
    url: https://jespark.net/projects/2024/community_forensics/   # arXiv 2411.04125
    license: CC BY 4.0 (paired reals keep their source licenses)
    size: PublicEval 51.8k images / 27.7 GB (6 shards) + Commercial 14.9k fakes / 16.6 GB (2 shards)
    generators: [flux-dev, flux-schnell, ideogramv1, firefly-image3, midjourneyv6-1, midjourneyv5-2,
                 dalle2, dalle3, imagen3, ideogramv2, firefly-image2, "... (slug of model_name)"]
    content_types: [photo]
    has_masks: false
    download: auto
    notes: >-
      Whole repo is 1.1 TB (2.7M fakes from 4,803 generators); only the test-side PublicEval and
      Commercial parquets are used. Shards are single 3-6 GB row groups, downloaded whole and deleted
      after export; one shard per ~4k requested images per part. The paper's full eval set is
      OwensLab/CommunityForensics-Eval (206 GB, CC BY-NC-SA 4.0), not used.

  - name: so_fake
    hf_id: saberzl/So-Fake-OOD          # + saberzl/So-Fake-Set (validation split only)
    url: https://hzlsaber.github.io/projects/So-Fake/   # arXiv 2505.18660
    license: OOD CC BY-NC 4.0; Set card text says CC BY 4.0 (no license tag)
    size: OOD 91.4k redistributable rows / 135 GB (46 shards); Set validation 235.7k rows / ~116 GB (232 shards)
    generators: [gpt-image-2, nano-banana-2, flux.2, flux.1-pro, gpt-image-1.5, gpt-4o, hidream, ideogram-2,
                 ideogram-3, imagen-3, imagen-4, recraft-v3, seedream-3.0, seedream-4.5, nano-banana,
                 openai-edit, ideogram-edit, flux.1-dev, sdxl, latent-diffusion, imagic, "... ~30 open models"]
    content_types: [photo]
    has_masks: true
    download: auto
    notes: >-
      Social-media style real / full-synthetic / tampered. X and Instagram reals of OOD are released as
      links only and skipped. Native masks are L/RGB/RGBA PNG, some soft, binarized at 127. The 1.17 TB
      So-Fake-Set train split is not used. One shard per ~1k requested images per repo.

  - name: chameleon
    url: https://github.com/shilinyan99/AIDE   # arXiv 2406.19435; data by e-mail to tattoo.ysl@gmail.com
    license: academic research only, commercial use prohibited
    size: 26,033 images (count from the ITW-SM comparison table)
    generators: [unknown]
    content_types: [photo]
    has_masks: false
    download: manual
    notes: >-
      Human-fooling AI images from AI-art communities vs photographer photos. No official HF / Drive
      mirror. Expected layout chameleon/test/{0_real,1_fake}/ (any 0_real / 1_fake folder is listed).

  - name: wildrf
    url: https://github.com/barcavia/RealTime-DeepfakeDetection-in-the-RealWorld   # arXiv 2406.09398
    license: not stated for the data; code under a non-commercial "Software Research License"
    size: one Google Drive zip (file id 1A0xoL44Yg68ixd-FuIJn2VC4vdZ6M2gn), size not stated
    generators: [unknown]
    content_types: [photo]
    has_masks: false
    download: manual
    notes: >-
      Reddit / X / Facebook real vs fake. Only WildRF/test/{reddit,twitter,facebook}/{0_real,1_fake}
      is listed; the Reddit train/val folders are ignored.

  - name: itw_sm
    hf_id: dkarageo/itw-sm
    url: https://mever-team.github.io/itw-sm   # arXiv 2507.10236
    license: custom ITW-SM terms (non-commercial research, no redistribution, no re-identification)
    size: 10,000 images (5k real / 5k fake), 3.6 GB
    generators: [unknown]
    content_types: [photo]
    has_masks: false
    download: auto
    notes: >-
      Gated (manual approval): request access on the HF page, then `hf auth login`; without access
      download() prints instructions. Facebook / Instagram / LinkedIn / X at native resolution.

  - name: openfake
    hf_id: ComplexDataLab/OpenFake
    url: https://huggingface.co/datasets/ComplexDataLab/OpenFake   # arXiv 2509.09495
    license: CC BY-NC 4.0 (proprietary-generator subsets under provider non-compete terms)
    size: core test 91.4k rows / ~67 GB (13 shards) + reddit test 36.1k rows / 24.6 GB (5 shards)
    generators: [z-image-turbo, flux.2-klein-9b, illustrious, gpt-image-1.5, gpt-image-2, midjourney-7,
                 nano-banana-pro, seedream-v5.0, recraft-v3, veo-3, sora-2, wan-video-2.5, unknown, "..."]
    content_types: [photo, art]
    has_masks: false
    download: auto
    notes: >-
      POLITICAL content by design (public figures, protests, disasters, memes with text): expect
      identifiable people and misinformation-style images. core test = held-out OOD generators with
      DOCCI / ImageNet reals; reddit = in-the-wild, fakes have no generator (unknown). 3.4 TB train
      split untouched. ~5 GB shards, so even a small cap downloads 2 shards.

  - name: textfake
    hf_id: Yuning0123/TextFake
    url: https://arxiv.org/abs/2606.01050
    license: research only via data-use agreement (non-commercial, no redistribution)
    size: 20,000 images (10k real / 10k fake), one 22.1 GB zip
    generators: [qwen-image-2, nano-banana-2, seedream-5-lite, gpt-image-2]
    content_types: [text]
    has_masks: false
    download: auto
    notes: >-
      Gated: e-mail ynzhang2022@gmail.com (template on the HF page), wait for approval, `hf auth login`.
      Screenshots / documents / news pages in 28 languages. The zip layout could not be inspected
      (gated), so rows() infers label and generator from path words; check after the first download.

  - name: impostor
    url: https://arxiv.org/abs/2606.04545
    license: unknown (not released)
    size: 100k manipulated images (paper); 7:1 train/test per editor
    generators: [flux.1-fill, flux.1-kontext, powerpaint, step1x-edit, qwen-image-edit, omnieraser,
                 nano-banana-pro-edit]
    content_types: [photo]
    has_masks: true
    download: manual
    notes: >-
      STUB. No public download found on 2026-10-20 (no link in the paper; HF `Impostor/Pixel` is an
      unrelated empty repo). Adapter reads impostor/real/, impostor/fake/<editor>/,
      impostor/mask/<editor>/ once someone provides the data. LVIS source photos; add / remove / inpaint.

  - name: opensdid
    hf_id: nebula/OpenSDI_test
    url: https://github.com/iamwangyabin/OpenSDI   # CVPR 2025, arXiv 2503.19653
    license: CC BY-SA 4.0, academic use (reals from megalith-10m)
    size: 100k images (10k real + 10k fake per generator), 18.3 GB, 52 shards
    generators: [sd-1.5, sd-2.1, sdxl, sd3, flux.1]
    content_types: [photo]
    has_masks: true
    download: auto
    notes: >-
      key entire/* = global synthesis, partial/* = local edits with grey-level masks (white = edited,
      binarized). Shards are roughly ordered by kind, so a cap downloads >= 4 spread shards per
      generator. OpenSDI_train (SD1.5) and nebula/OpenSDIDplus (802k rows) are not used.

  - name: inpx
    url: https://www.kaggle.com/datasets/emirhanbilgic/inpainting-exchange   # arXiv 2602.00192
    license: MIT (Kaggle page and GitHub README)
    size: 10.7 GB, 120k files; test-data = 10k originals + 10k standard + 10k exchanged inpaints + masks
    generators: [kandinsky-2.2, openjourney, sd-1.4, kandinsky-2.2-inpx, openjourney-inpx, sd-1.4-inpx]
    content_types: [photo]
    has_masks: true
    download: manual
    notes: >-
      Kaggle needs a login / API token. CelebA-HQ, CityScapes, OpenImages, SUN-RGBD; "-inpx" = pixels
      outside the mask restored to the original (no global VAE trace). JPEG masks matched by id across
      all masks/*_masks folders (some CityScapes masks sit in OpenImages_masks). Only test-data/ used.

  - name: aigibench
    hf_id: HorizonTEL/AIGIBench
    url: https://github.com/HorizonTEL/AIGIBench   # NeurIPS 2025, arXiv 2505.12335; also Baidu Netdisk
    license: CC BY-NC-SA 4.0
    size: 25 test zips, 176 GB (equal real / fake per subset)
    generators: [progan, r3gan, stylegan3, stylegan-xl, wfir, sdxl, sd3, flux.1-dev, dalle-3, imagen-3,
                 midjourney-v6, glide, blip-diffusion, blendface, e4s, faceswap, inswap, simswap, styleswim,
                 instantid, infinite-id, ip-adapter, photomaker, unknown]
    content_types: [photo]
    has_masks: false
    download: auto
    notes: >-
      CommunityAI and SocialRF are crawls of AI communities / social media (generator unknown). Many
      face-swap and personalization subsets. train/ and val/ zips (ProGAN, SD-v1.4) not used.

  - name: genimage
    hf_id: nebula/GenImage-arrow        # repack of the official Google Drive / Baidu release
    url: https://github.com/GenImage-Dataset/GenImage
    license: CC BY-NC-SA 4.0
    size: test split 96k images (6k real + 6k fake x 8 generators), 25.5 GB of Arrow shards
    generators: [adm, biggan, glide, midjourney-v5, sd-1.4, sd-1.5, vqdm, wukong]
    content_types: [photo]
    has_masks: false
    download: auto
    notes: >-
      Older but standard. Reals are ImageNet val JPEGs, fakes mostly PNG: format / size shortcuts are
      possible, read scores with care. Shards hold reals first, fakes last; a cap downloads >= 2
      spread shards per generator. 630 GB train split not used.
